---
layout: default
---

<div class="article-list-header">
    <h1>Codes</h1>
    <small>技术文章</small>
</div>

<div class="article-list">
    {% for post in site.tags.codes %}
    <div class="article-item">
        <span class="article-date">{{ post.date | date_to_string }}</span>
        <a href="{{ post.url }}" class="article-link" title="{{ post.title }}">{{ post.title }}</a>
    </div>
    {% endfor %}
</div>
