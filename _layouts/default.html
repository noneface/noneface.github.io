<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Noneface 的技术博客 — 后端研发、安全、工程实践">
    <meta name="author" content="Noneface">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}Noneface | Hack4fun">
    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:description" content="{% if page.title %}{{ page.title }}{% else %}精于一而悟道{% endif %}">

    <!-- Prevent FOUC: apply dark mode before page renders -->
    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/pygments.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <title>{% if page.title %}{{ page.title }} — {% endif %}Noneface | Hack4fun</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-brand">
                <img src="/images/head1.png" alt="Noneface" class="brand-avatar">
                <span class="brand-name">Noneface</span>
            </a>
            <nav class="site-nav" id="site-nav">
                <a href="/" class="nav-link"><i class="fa-solid fa-home"></i> Home</a>
                <a href="/codes.html" class="nav-link"><i class="fa-solid fa-code"></i> Codes</a>
                <a href="/notes.html" class="nav-link"><i class="fa-solid fa-pen"></i> Notes</a>
                <a href="/about-me.html" class="nav-link"><i class="fa-solid fa-user"></i> About</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="site-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="https://github.com/noneface" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>
                <a href="https://weibo.com/noneface" target="_blank" rel="noopener"><i class="fa-brands fa-weibo"></i></a>
            </div>
            <p class="footer-motto">精 于 一 而 悟 道</p>
            <p class="footer-copy">Follow your heart &nbsp;|&nbsp; nonefacesay@gmail.com</p>
        </div>
    </footer>

    <script src="/assets/js/main.js"></script>
</body>
</html>
