---
layout: default
---

<div class="dashboard">
  <header class="dashboard-header">
    <img src="/images/head1.png" alt="" class="dashboard-avatar">
    <h1 class="dashboard-title">noneface</h1>
    <p class="dashboard-subtitle">精于一而悟道</p>
  </header>

  <div class="service-grid">
    {% for svc in site.data.services %}
    <a href="{{ svc.url }}" class="service-card" target="_blank" rel="noopener">
      <div class="service-card-icon">
        <i class="fa-solid {{ svc.icon }}"></i>
      </div>
      <div class="service-card-info">
        <span class="service-card-name">{{ svc.name }}</span>
        <span class="service-card-desc">{{ svc.desc }}</span>
      </div>
    </a>
    {% endfor %}
  </div>

  <section class="recent-posts">
    <h2 class="recent-posts-heading">最近文章</h2>
    <div class="recent-posts-list">
      {% for post in site.posts limit:5 %}
      <a href="{{ post.url }}" class="recent-post-item">
        <span class="recent-post-title">{{ post.title }}</span>
        <span class="recent-post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      </a>
      {% endfor %}
    </div>
    <div class="recent-posts-footer">
      <a href="/codes.html">技术文章</a>
      <span class="recent-posts-sep">·</span>
      <a href="/notes.html">随笔杂记</a>
    </div>
  </section>
</div>
